<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Snake Game Pro</title>

<link rel="stylesheet"
href="/home/rgukt/Downloads/PRO/projects/snake-game/style.css">

</head>

<body>

<!-- TOP BAR -->

<div class="top-bar">

<div id="lives">
Lives: ❤️ ❤️ ❤️
</div>

<div id="score">
Score: 0
</div>

</div>

<!-- GAME AREA -->

<div class="game-container">

<canvas id="gameCanvas"
width="600"
height="600">
</canvas>

</div>

<!-- LEFT CONTROLS -->

<div class="left-controls">

<button onclick="pauseGame()">
⏸️ Pause
</button>

<button onclick="resumeGame()">
▶️ Resume
</button>

</div>

<!-- RIGHT CONTROLS -->

<div class="right-controls">

<button onclick="restartGame()">
🔁 Restart
</button>

<button onclick="toggleSettings()">
⚙️ Settings
</button>

</div>

<!-- MOBILE CONTROLS -->

<div class="mobile-controls">

<button onclick="setDirection('UP')">
⬆️
</button>

<div class="middle-row">

<button onclick="setDirection('LEFT')">
⬅️
</button>

<button onclick="setDirection('DOWN')">
⬇️
</button>

<button onclick="setDirection('RIGHT')">
➡️
</button>

</div>

</div>

<!-- SETTINGS -->

<div id="settings"
class="settings hidden">

<h2>⚙️ SETTINGS</h2>

<h3>Speed</h3>

<button onclick="changeSpeed(200)">
Slow
</button>

<button onclick="changeSpeed(140)">
Medium
</button>

<button onclick="changeSpeed(90)">
High
</button>

<h3>Sound</h3>

<input type="range"
min="0"
max="1"
step="0.1"
value="0.5"
onchange="changeVolume(this.value)">

<br><br>

<button onclick="toggleSettings()">
Close
</button>

</div>

<!-- START SCREEN -->

<div id="startScreen"
class="overlay">

<h1>
🐍 SNAKE GAME 🐍
</h1>

<button class="big-btn"
onclick="startGame()">

▶️ START GAME

</button>

</div>

<!-- MENU -->

<div id="menuScreen"
class="overlay hidden">

<h1 id="menuTitle">
Continue?
</h1>

<button id="continueBtn"
class="big-btn"
onclick="continueGame()">

▶️ CONTINUE

</button>

<button class="big-btn"
onclick="restartGame()">

🔁 RESTART

</button>

</div>

<!-- STATUS -->

<div id="statusText"
class="hidden-status">

GAME PAUSED

</div>

<script src="/home/rgukt/Downloads/PRO/projects/snake-game/script.js"></script>

</body>
</html>
